services:
  database:
    container_name: task-tracker-database
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5555:5432'
    networks:
      - task-tracker-net
    volumes:
      - 'database-volume:/var/lib/postgresql/data'

  broker:
    image: apache/kafka:latest
    container_name: task-tracker-broker
    ports:
      - "9092:9092"
    networks:
      - task-tracker-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: DOCKER://:9092,HOST://:9093,CONTROLLER://:9094

      KAFKA_ADVERTISED_LISTENERS: DOCKER://broker:9092,HOST://localhost:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


volumes:
  database-volume:

networks:
  task-tracker-net:
    name: task-tracker-net